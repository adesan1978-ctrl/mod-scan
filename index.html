<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7b6cc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="มดสแกน">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=swap" rel="stylesheet">
<title>มดสแกน</title>
<style>
:root{--bg:#fff9f2;--card:#fff;--ink:#3a3340;--soft:#7a6f80;--pink:#f7b6cc;--pinkD:#c9557f;--blue:#cfe6f7;--blueD:#3e7fb0;--line:#f0e4dc;color-scheme:light}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans Thai Looped","Mitr",sans-serif;overflow-x:clip}
h1,h2,.btn,.chip b{font-family:"Mitr",sans-serif;font-weight:500}
.wrap{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 110px)}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
header img{width:44px;height:44px;border-radius:12px}
h1{font-size:26px;margin:0;line-height:1.1}
header p{margin:0;color:var(--soft);font-size:14px}
#install{margin-left:auto}
h2{font-size:18px;margin:22px 0 10px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.chip b{display:block;font-size:16px}
.chip span{font-size:13px;color:var(--soft);line-height:1.35;display:block;margin-top:2px}
.chip[aria-pressed=true]{border-color:var(--pinkD);background:#fff0f5}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;min-height:48px;padding:10px 16px;font-size:16px;cursor:pointer;background:var(--blue);color:#1f4d70}
.btn.main{background:var(--pinkD);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45}
.btn:focus-visible,.chip:focus-visible,input:focus-visible{outline:3px solid var(--blueD);outline-offset:2px}
.field input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pg{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;cursor:pointer}
.pg img{width:100%;aspect-ratio:3/4;object-fit:contain;display:block;background:#f6f1ec;border-radius:8px}
.pg i{position:absolute;top:10px;left:10px;background:var(--pinkD);color:#fff;font-style:normal;font-size:12px;border-radius:8px;padding:0 7px}
.empty{background:#fff;border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--soft)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(transparent,var(--bg) 30%);display:flex;justify-content:center}
.scan{width:min(100%,420px);min-height:62px;font-size:19px;border-radius:20px;box-shadow:0 8px 20px #c9557f40}
.note{font-size:13px;color:var(--soft);margin-top:8px}
.screen{position:fixed;inset:0;background:#1f1a23;color:#fff;display:none;flex-direction:column;z-index:10}
.screen.on{display:flex}
.top{padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;display:flex;align-items:center;gap:10px}
.top b{font-family:Mitr;font-weight:500;font-size:17px}
.stage{flex:1;position:relative;overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.stage img{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);object-fit:contain}
.bar{padding:10px 14px calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bar .btn.ghost,.top .btn.ghost{color:#fff;border-color:#ffffff40}
.mini{display:flex;gap:6px;overflow-x:auto;padding:0 14px 6px;scrollbar-width:none}
.mini button{flex:none;border:1px solid #ffffff40;background:#0006;color:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;min-height:38px}
.mini button[aria-pressed=true]{background:var(--pink);color:#3a3340;border-color:var(--pink)}
/* camera */
#camScr video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#status{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#000a;padding:7px 16px;border-radius:999px;font-size:15px;white-space:nowrap;font-family:Mitr}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.camBar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 20px calc(env(safe-area-inset-bottom) + 18px)}
#shutter{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:var(--pink);cursor:pointer;position:relative}
#shutter svg{position:absolute;inset:-9px;width:calc(100% + 18px);height:calc(100% + 18px);transform:rotate(-90deg)}
#thumb{justify-self:start;width:56px;height:56px;border-radius:12px;border:2px solid #fff;background:#0006 center/cover no-repeat;position:relative;cursor:pointer;color:#fff;font:inherit}
#thumb i{position:absolute;top:-8px;right:-8px;background:var(--pinkD);border-radius:999px;font-style:normal;font-size:13px;min-width:24px;height:24px;line-height:24px;text-align:center;padding:0 6px}
#done{justify-self:end}
.tg{border:1px solid #ffffff50;background:#0006;color:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;min-height:38px}
.tg[aria-pressed=true]{background:var(--blue);color:#1f4d70;border-color:var(--blue)}
#busy{position:fixed;inset:0;background:#1f1a2399;display:none;place-items:center;z-index:30;color:#fff;font-family:Mitr}
#busy.on{display:grid}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 120px);transform:translateX(-50%);background:#3a3340;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;z-index:40;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#ios{display:none}
@media(prefers-reduced-motion:reduce){#toast,#flash{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="icon-192.png" alt="">
    <div><h1>มดสแกน</h1><p>เปิดกล้องไว้ แอปจับเอกสารแล้วถ่ายให้เอง</p></div>
    <button class="btn sm" id="install" hidden>ติดตั้งแอป</button>
  </header>
  <p class="note" id="ios">ติดตั้งบน iPhone: กดปุ่มแชร์ของ Safari แล้วเลือก "เพิ่มไปยังหน้าจอโฮม"</p>

  <h2>เลือกแบบสแกน</h2>
  <div class="modes" id="modes"></div>

  <div class="field">
    <h2 style="margin-bottom:8px">ชื่อเอกสาร</h2>
    <input id="docname" placeholder="เช่น ใบลา TA, บันทึกเหตุการณ์" autocomplete="off">
  </div>

  <h2 id="pgTitle">หน้าที่สแกนไว้</h2>
  <div id="pages"></div>
  <div class="row" id="actions" style="margin-top:12px"></div>
</div>

<div class="dock"><div style="display:flex;gap:10px;width:min(100%,460px)"><button class="btn main scan" id="scanBtn" style="flex:1">สแกนเอกสาร</button><button class="btn scan" id="nativeBtn" style="flex:none;width:118px;font-size:15px;line-height:1.25;box-shadow:none">กล้องเครื่อง<br><small>ชัดที่สุด</small></button></div></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="pick" accept="image/*" multiple hidden>

<section class="screen" id="camScr">
  <div class="stage" id="camStage">
    <video id="vid" playsinline muted autoplay></video>
    <canvas id="ov"></canvas>
    <div id="flash"></div>
    <div id="status">กำลังเปิดกล้อง...</div>
  </div>
  <div class="mini" id="camModes" style="padding-top:10px"></div>
  <div class="mini">
    <button class="tg" id="autoTg" aria-pressed="true">ถ่ายอัตโนมัติ</button>
    <button class="tg" id="torchTg" aria-pressed="false" hidden>ไฟฉาย</button>
  </div>
  <div class="camBar">
    <button id="thumb" aria-label="หน้าที่สแกนแล้ว"><i id="cnt">0</i></button>
    <button id="shutter" aria-label="ถ่ายเลย"><svg viewBox="0 0 100 100"><circle id="ring" cx="50" cy="50" r="46" fill="none" stroke="#c9557f" stroke-width="7" stroke-dasharray="289" stroke-dashoffset="289" stroke-linecap="round"/></svg></button>
    <button class="btn main" id="done">เสร็จ</button>
  </div>
</section>

<section class="screen" id="cropScr">
  <div class="top"><button class="btn sm ghost" id="cropBack">ยกเลิก</button><b>ลากมุมให้ตรงขอบกระดาษ</b></div>
  <div class="stage"><canvas id="ed"></canvas></div>
  <div class="bar">
    <button class="btn sm ghost" id="rot">หมุน</button>
    <button class="btn sm ghost" id="auto">หาขอบอัตโนมัติ</button>
    <button class="btn sm ghost" id="full">ใช้ทั้งภาพ</button>
    <button class="btn main" id="cropOk">ตกลง</button>
  </div>
</section>

<section class="screen" id="resScr">
  <div class="top"><button class="btn sm ghost" id="resBack">ปรับขอบ</button><b>ตรวจผลสแกน</b></div>
  <div class="stage"><img id="resImg" alt="ผลสแกน"></div>
  <div class="mini" id="resModes"></div>
  <div class="bar">
    <button class="btn ghost" id="resCancel">ยกเลิก</button>
    <button class="btn" id="saveMore">เก็บแล้วถ่ายต่อ</button>
    <button class="btn main" id="saveDone">เก็บหน้านี้</button>
  </div>
</section>

<section class="screen" id="viewScr">
  <div class="top"><button class="btn sm ghost" id="viewBack">กลับ</button><b id="viewTitle">หน้า</b></div>
  <div class="stage"><img id="viewImg" alt=""></div>
  <div class="bar">
    <button class="btn ghost" id="vEdit">ปรับขอบ/แบบสแกน</button>
    <button class="btn ghost" id="vUp">เลื่อนขึ้น</button>
    <button class="btn ghost" id="vDel">ลบ</button>
    <button class="btn" id="vShare">แชร์</button>
    <button class="btn main" id="vSave">บันทึกรูป</button>
  </div>
</section>

<div id="busy">กำลังประมวลผล...</div>
<div id="toast"></div>

<script>
{
const $=s=>document.querySelector(s);
const MODES=[
 {id:'bw',name:'เอกสารขาวดำ',hint:'ตัวหนังสือคม พื้นขาว เหมาะกับแบบฟอร์ม'},
 {id:'doc',name:'เอกสารสี',hint:'พื้นขาวสะอาด เก็บสีตราประทับ ลายเซ็น'},
 {id:'gray',name:'สีเทา',hint:'ไฟล์เล็ก อ่านง่าย'},
 {id:'photo',name:'รูปถ่ายต้นฉบับ',hint:'ไม่ปรับสี เก็บตามจริง'},
 {id:'card',name:'บัตร',hint:'ตัดสัดส่วนบัตรมาตรฐาน สีชัด'}
];
const store={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let mode=store.get('mode','bw'),curMode=mode,autoOn=store.get('auto','1')==='1';
$('#docname').value=store.get('docname','');
$('#docname').oninput=e=>store.set('docname',e.target.value);
const toast=t=>{const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2200)};
const busy=on=>$('#busy').classList.toggle('on',on);
const show=id=>document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
const tick=()=>new Promise(r=>setTimeout(r,20));

function renderModes(){
 $('#modes').innerHTML=MODES.map(m=>`<button class="chip" data-m="${m.id}" aria-pressed="${m.id===mode}"><b>${m.name}</b><span>${m.hint}</span></button>`).join('');
 $('#camModes').innerHTML=MODES.map(m=>`<button data-m="${m.id}" aria-pressed="${m.id===mode}">${m.name}</button>`).join('');
 $('#resModes').innerHTML=MODES.map(m=>`<button data-m="${m.id}" aria-pressed="${m.id===curMode}">${m.name}</button>`).join('');
}
const setMode=m=>{mode=m;store.set('mode',m);renderModes()};
$('#modes').onclick=e=>{const b=e.target.closest('[data-m]');if(b)setMode(b.dataset.m)};
$('#camModes').onclick=e=>{const b=e.target.closest('[data-m]');if(b)setMode(b.dataset.m)};

/* ---------- OpenCV (ตัวจับขอบเอกสาร) ---------- */
let CV=null;
(function loadCv(){const s=document.createElement('script');s.src='opencv.js';s.async=true;
 s.onload=()=>{const w=window.cv;const ok=m=>{CV=m;window.cv=m};
  if(w&&w.Mat)ok(w);else if(w&&typeof w.then==='function')w.then(m=>{const mm=m;delete mm.then;ok(mm)});else if(w)w.onRuntimeInitialized=()=>ok(w)};
 document.body.appendChild(s)})();

function order4(p){const s=[...p].sort((a,b)=>(a.x+a.y)-(b.x+b.y));const tl=s[0],br=s[3];const r=[s[1],s[2]].sort((a,b)=>(a.x-a.y)-(b.x-b.y));return[tl,r[1],br,r[0]]}
function cvQuad(canvas){
 const cv=CV,W=canvas.width,H=canvas.height,img=cv.imread(canvas),g=new cv.Mat(),e=new cv.Mat(),cs=new cv.MatVector(),hi=new cv.Mat(),k=cv.Mat.ones(5,5,cv.CV_8U);
 let best=null,bestA=W*H*.15;
 const scan=(eps)=>{cv.findContours(e,cs,hi,cv.RETR_LIST,cv.CHAIN_APPROX_SIMPLE);
  for(let i=0;i<cs.size();i++){const c=cs.get(i),a=cv.contourArea(c);
   if(a>bestA&&a<W*H*.985){const hull=new cv.Mat(),ap=new cv.Mat();cv.convexHull(c,hull,false,true);
    for(const ep of eps){cv.approxPolyDP(hull,ap,ep*cv.arcLength(hull,true),true);if(ap.rows===4)break}
    if(ap.rows===4&&cv.isContourConvex(ap)){bestA=a;best=[];for(let j=0;j<4;j++)best.push({x:ap.data32S[j*2],y:ap.data32S[j*2+1]})}hull.delete();ap.delete()}
   c.delete()}};
 try{
  cv.cvtColor(img,g,cv.COLOR_RGBA2GRAY);cv.GaussianBlur(g,g,new cv.Size(5,5),0);
  for(const [lo,hiT] of [[40,120],[15,45]]){cv.Canny(g,e,lo,hiT);cv.morphologyEx(e,e,cv.MORPH_CLOSE,k);scan([.02,.04])}
  cv.threshold(g,e,0,255,cv.THRESH_BINARY+cv.THRESH_OTSU);cv.morphologyEx(e,e,cv.MORPH_CLOSE,k);scan([.02,.04,.06]);
  const m=cv.mean(g)[0];cv.threshold(g,e,Math.min(250,m+12),255,cv.THRESH_BINARY);cv.morphologyEx(e,e,cv.MORPH_CLOSE,k);scan([.02,.04,.06])
 }finally{img.delete();g.delete();e.delete();cs.delete();hi.delete();k.delete()}
 return best&&order4(best);
}
/* สำรองถ้า OpenCV ยังโหลดไม่เสร็จ: หาแผ่นกระดาษที่สว่างกว่าพื้น */
function blobQuad(c){
 const w=c.width,h=c.height,d=c.getContext('2d').getImageData(0,0,w,h).data,g=new Uint8Array(w*h),hist=new Array(256).fill(0);
 for(let i=0;i<w*h;i++){const v=(d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11)|0;g[i]=v;hist[v]++}
 let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i];let sB=0,wB=0,best=0,th=128;
 for(let i=0;i<256;i++){wB+=hist[i];if(!wB)continue;const wF=w*h-wB;if(!wF)break;sB+=i*hist[i];const v=wB*wF*(sB/wB-(sum-sB)/wF)**2;if(v>best){best=v;th=i}}
 const lab=new Int32Array(w*h),st=new Int32Array(w*h);let bN=0,bL=0,L=0;
 for(let i=0;i<w*h;i++){if(g[i]<=th||lab[i])continue;L++;let sp=0,n=0;st[sp++]=i;lab[i]=L;
  while(sp){const p=st[--sp];n++;const px=p%w;for(const q of[px>0?p-1:-1,px<w-1?p+1:-1,p-w,p+w])if(q>=0&&q<w*h&&!lab[q]&&g[q]>th){lab[q]=L;st[sp++]=q}}
  if(n>bN){bN=n;bL=L}}
 if(bN<w*h*.12||bN>w*h*.95)return null;
 let tl=[1e9],tr=[-1e9],br=[-1e9],bl=[1e9];
 for(let i=0;i<w*h;i++){if(lab[i]!==bL)continue;const px=i%w,py=(i/w)|0,s=px+py,df=px-py;if(s<tl[0])tl=[s,px,py];if(s>br[0])br=[s,px,py];if(df>tr[0])tr=[df,px,py];if(df<bl[0])bl=[df,px,py]}
 return[tl,tr,br,bl].map(a=>({x:a[1],y:a[2]}));
}
function detectOn(canvas,size){
 const S=size/Math.max(canvas.width,canvas.height),t=document.createElement('canvas');t.width=Math.round(canvas.width*S);t.height=Math.round(canvas.height*S);
 t.getContext('2d').drawImage(canvas,0,0,t.width,t.height);let q=null;
 try{q=CV?cvQuad(t):blobQuad(t)}catch(e){q=null}
 return q&&q.map(p=>({x:p.x/S,y:p.y/S}));
}

/* ---------- IndexedDB ---------- */
const dbp=new Promise((res,rej)=>{const r=indexedDB.open('modscan',1);r.onupgradeneeded=()=>r.result.createObjectStore('pages',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function tx(m,fn){const d=await dbp;return new Promise((res,rej)=>{const t=d.transaction('pages',m);const q=fn(t.objectStore('pages'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})}
let pages=[],urls=[];
async function load(){pages=(await tx('readonly',s=>s.getAll())||[]).sort((a,b)=>a.order-b.order);renderPages()}
function renderPages(){
 urls.forEach(URL.revokeObjectURL);urls=pages.map(p=>URL.createObjectURL(p.blob));
 $('#pgTitle').textContent=pages.length?`หน้าที่สแกนไว้ (${pages.length} หน้า)`:'หน้าที่สแกนไว้';
 $('#pages').innerHTML=pages.length?`<div class="grid">${pages.map((p,i)=>`<div class="pg" data-i="${i}"><img src="${urls[i]}" alt="หน้า ${i+1}"><i>${i+1}</i></div>`).join('')}</div>`
  :`<div class="empty">ยังไม่มีเอกสาร<br>กดปุ่มสแกนด้านล่าง แล้วส่องกล้องไปที่กระดาษได้เลย</div>`;
 $('#actions').innerHTML=pages.length?`<button class="btn main" id="aPdf">รวมเป็น PDF</button><button class="btn" id="aJpg">บันทึกรูปทั้งหมด</button><button class="btn" id="aShare">แชร์ทั้งหมด</button><button class="btn ghost" id="aPick">เพิ่มจากคลังภาพ</button><button class="btn ghost" id="aClear">ล้างทั้งหมด</button>`
  :`<button class="btn ghost" id="aPick">เลือกรูปจากคลังภาพ</button>`;
 $('#cnt').textContent=pages.length;$('#thumb').style.backgroundImage=pages.length?`url(${urls[urls.length-1]})`:'none';
}
$('#pages').onclick=e=>{const p=e.target.closest('.pg');if(p)openView(+p.dataset.i)};
$('#actions').onclick=e=>{const id=e.target.id;
 if(id==='aPick')$('#pick').click();if(id==='aPdf')doPdf();if(id==='aJpg')doJpgAll();if(id==='aShare')doShareAll();
 if(id==='aClear'&&confirm('ล้างหน้าที่สแกนไว้ทั้งหมด?'))tx('readwrite',s=>s.clear()).then(load)};
async function addPage(rec){rec.order=pages.length?Math.max(...pages.map(p=>p.order))+1:1;rec.id=Date.now()+'_'+Math.random().toString(36).slice(2,6);await tx('readwrite',s=>s.put(rec));await load()}

/* ---------- ชื่อไฟล์ วัน-เดือน-ปี พ.ศ. ---------- */
function stamp(){const d=new Date();return `${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()+543}`}
function baseName(){return ($('#docname').value.trim()||'สแกน').replace(/[\\/:*?"<>|]+/g,' ')+'_'+stamp()}

/* ---------- กล้องสด + จับเอกสารอัตโนมัติ ---------- */
const vid=$('#vid'),ov=$('#ov');let stream=null,track=null,loopT=0,quad=null,shown=null,stable=0,armed=true,lastQ=null,capturing=false,lostFrames=0;
const NEED=7; // จำนวนเฟรมที่ต้องนิ่ง (ประมาณ 1 วินาที)
$('#scanBtn').onclick=openCam;$('#nativeBtn').onclick=()=>$('#cam').click();
async function openCam(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('#cam').click();return}
 show('camScr');renderModes();$('#autoTg').setAttribute('aria-pressed',autoOn);setStatus('กำลังเปิดกล้อง...');
 try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:4032},height:{ideal:3024},aspectRatio:{ideal:4/3}}})}
 catch(e){show(null);toast('เปิดกล้องไม่ได้ ใช้กล้องของเครื่องแทน');$('#cam').click();return}
 vid.srcObject=stream;track=stream.getVideoTracks()[0];
 try{const cap=track.getCapabilities&&track.getCapabilities();$('#torchTg').hidden=!(cap&&cap.torch);if(cap&&cap.focusMode&&cap.focusMode.includes('continuous'))track.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{})}catch(e){}
 await vid.play().catch(()=>{});armed=true;stable=0;quad=shown=lastQ=null;
 clearInterval(loopT);loopT=setInterval(step,130);requestAnimationFrame(drawOv);
}
function closeCam(){clearInterval(loopT);loopT=0;if(stream)stream.getTracks().forEach(t=>t.stop());stream=track=null;$('#torchTg').setAttribute('aria-pressed','false')}
function setStatus(t){$('#status').textContent=t}
const work=document.createElement('canvas');
function step(){
 if(!vid.videoWidth||capturing)return;
 const S=480/Math.max(vid.videoWidth,vid.videoHeight);work.width=Math.round(vid.videoWidth*S);work.height=Math.round(vid.videoHeight*S);
 work.getContext('2d').drawImage(vid,0,0,work.width,work.height);
 let q=null;try{q=CV?cvQuad(work):null}catch(e){q=null}
 if(!CV)setStatus('กำลังเตรียมตัวจับเอกสาร... กดถ่ายเองได้');
 if(q){q=q.map(p=>({x:p.x/S,y:p.y/S}));lostFrames=0;
  const diag=Math.hypot(vid.videoWidth,vid.videoHeight),mv=lastQ?Math.max(...q.map((p,i)=>Math.hypot(p.x-lastQ[i].x,p.y-lastQ[i].y)))/diag:1;
  if(!armed&&mv>.06)armed=true;
  stable=mv<.018?stable+1:0;lastQ=q;quad=q;
  if(!autoOn)setStatus('เจอเอกสารแล้ว กดถ่ายได้เลย');
  else if(!armed)setStatus('เปลี่ยนหน้าถัดไปได้เลย');
  else if(stable<NEED)setStatus('เจอเอกสารแล้ว ถือนิ่งๆ');
  else{capture();return}
 }else if(CV){lostFrames++;if(lostFrames>2){quad=null;lastQ=null;stable=0;armed=true;setStatus(autoOn?'ส่องกล้องให้เห็นกระดาษทั้งแผ่น':'กดถ่ายได้เลย')}}
 const prog=autoOn&&armed&&quad?Math.min(1,stable/NEED):0;$('#ring').setAttribute('stroke-dashoffset',289*(1-prog));
}
function drawOv(){
 if(!$('#camScr').classList.contains('on'))return;
 const r=ov.getBoundingClientRect(),dpr=devicePixelRatio||1;if(ov.width!==Math.round(r.width*dpr)){ov.width=r.width*dpr;ov.height=r.height*dpr}
 const c=ov.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,r.width,r.height);
 if(quad&&vid.videoWidth){
  if(!shown)shown=quad.map(p=>({...p}));else shown=shown.map((p,i)=>({x:p.x+(quad[i].x-p.x)*.4,y:p.y+(quad[i].y-p.y)*.4}));
  const k=Math.max(r.width/vid.videoWidth,r.height/vid.videoHeight),ox=(r.width-vid.videoWidth*k)/2,oy=(r.height-vid.videoHeight*k)/2,P=shown.map(p=>({x:ox+p.x*k,y:oy+p.y*k}));
  c.beginPath();c.moveTo(P[0].x,P[0].y);P.slice(1).forEach(p=>c.lineTo(p.x,p.y));c.closePath();
  const ok=autoOn&&armed&&stable>=2;c.fillStyle=ok?'#cfe6f740':'#f7b6cc33';c.fill();c.lineWidth=4;c.strokeStyle=ok?'#9fd0f2':'#f7b6cc';c.stroke();
  P.forEach(p=>{c.beginPath();c.arc(p.x,p.y,6,0,7);c.fillStyle='#fff';c.fill()});
 }else shown=null;
 requestAnimationFrame(drawOv);
}
$('#shutter').onclick=()=>capture(true);
$('#autoTg').onclick=()=>{autoOn=!autoOn;store.set('auto',autoOn?'1':'0');$('#autoTg').setAttribute('aria-pressed',autoOn);stable=0};
$('#torchTg').onclick=async()=>{const on=$('#torchTg').getAttribute('aria-pressed')!=='true';try{await track.applyConstraints({advanced:[{torch:on}]});$('#torchTg').setAttribute('aria-pressed',on)}catch(e){toast('เปิดไฟฉายไม่ได้')}};
$('#done').onclick=$('#thumb').onclick=()=>{closeCam();show(null)};
async function capture(manual){
 if(capturing||!vid.videoWidth)return;capturing=true;
 const fl=$('#flash');fl.style.opacity=.85;setTimeout(()=>fl.style.opacity=0,120);if(navigator.vibrate)navigator.vibrate(40);
 let f=document.createElement('canvas');f.width=vid.videoWidth;f.height=vid.videoHeight;f.getContext('2d').drawImage(vid,0,0);
 let q=quad;setStatus('กำลังสแกน...');await tick();
 if(window.ImageCapture&&track){try{const ph=await new ImageCapture(track).takePhoto();const pc=await blobToCanvas(ph,4200);
  if(pc.width*f.height>0&&Math.abs(pc.width/pc.height-f.width/f.height)<.02){const k=pc.width/f.width;q=q&&q.map(p=>({x:p.x*k,y:p.y*k}));f=pc}
  else{const q2=detectOn(pc,800);if(q2){q=q2;f=pc}}}catch(e){}}
 if(manual&&!q)q=detectOn(f,800);if(!q)q=fullPts(f);
 try{const m=mode,out=applyMode(warp(f,q,m),m),blob=await toJpg(out,m),orig=await toJpg(f,'photo');await addPage({blob,orig,origW:f.width,pts:q,mode:m});toast(`เก็บหน้า ${pages.length} แล้ว`)}
 catch(e){toast('สแกนไม่สำเร็จ ลองอีกครั้ง')}
 armed=false;stable=0;capturing=false;$('#ring').setAttribute('stroke-dashoffset',289);
}
const toJpg=(c,m)=>new Promise(r=>c.toBlob(r,'image/jpeg',m==='photo'?.9:.92));
const fullPts=c=>[{x:0,y:0},{x:c.width,y:0},{x:c.width,y:c.height},{x:0,y:c.height}];
const inset=c=>{const mx=c.width*.06,my=c.height*.06;return[{x:mx,y:my},{x:c.width-mx,y:my},{x:c.width-mx,y:c.height-my},{x:mx,y:c.height-my}]};

/* ---------- รูปจากคลังภาพ / กล้องของเครื่อง ---------- */
let src=null,pts=null,queue=[],editId=null;
$('#cam').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f){queue=[];startFile(f)}};
$('#pick').onchange=e=>{queue=[...e.target.files];e.target.value='';if(queue.length)startFile(queue.shift())};
function blobToCanvas(b,max=4200){return new Promise((res,rej)=>{const url=URL.createObjectURL(b),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c)};im.onerror=rej;im.src=url})}
async function startFile(f){
 busy(true);editId=null;
 try{src=await blobToCanvas(f)}catch(e){busy(false);toast('เปิดรูปนี้ไม่ได้');return}
 curMode=mode;const q=detectOn(src,800);busy(false);
 if(q){pts=q;await showResult()}else{pts=inset(src);openCrop()}
}

/* ---------- ปรับขอบเอง ---------- */
const ed=$('#ed');let view={k:1,ox:0,oy:0},drag=-1,finger=null;
function openCrop(){show('cropScr');requestAnimationFrame(drawEd)}
function drawEd(){
 if(!src)return;const r=ed.getBoundingClientRect(),dpr=devicePixelRatio||1;ed.width=r.width*dpr;ed.height=r.height*dpr;
 const c=ed.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);const pad=28,k=Math.min((r.width-pad*2)/src.width,(r.height-pad*2)/src.height);

 const P=pts.map(p=>({x:view.ox+p.x*k,y:view.oy+p.y*k}));
 c.beginPath();c.rect(0,0,r.width,r.height);c.moveTo(P[0].x,P[0].y);P.slice(1).forEach(p=>c.lineTo(p.x,p.y));c.closePath();c.fillStyle='#1f1a2399';c.fill('evenodd');
 c.beginPath();c.moveTo(P[0].x,P[0].y);P.slice(1).forEach(p=>c.lineTo(p.x,p.y));c.closePath();c.strokeStyle='#f7b6cc';c.lineWidth=2.5;c.stroke();
 P.forEach((p,i)=>{c.beginPath();c.arc(p.x,p.y,i===drag?16:13,0,7);c.fillStyle='#ffffffdd';c.fill();c.lineWidth=3;c.strokeStyle='#c9557f';c.stroke()});
 if(drag>=0&&finger){const R=58,cx=finger.x<r.width/2?r.width-R-14:R+14,cy=R+14,Z=2.6,p=pts[drag],sz=R*2/(k*Z);
  c.save();c.beginPath();c.arc(cx,cy,R,0,7);c.clip();c.fillStyle='#000';c.fillRect(cx-R,cy-R,R*2,R*2);c.drawImage(src,p.x-sz/2,p.y-sz/2,sz,sz,cx-R,cy-R,R*2,R*2);c.restore();
  c.beginPath();c.arc(cx,cy,R,0,7);c.strokeStyle='#fff';c.lineWidth=3;c.stroke();c.beginPath();c.moveTo(cx-10,cy);c.lineTo(cx+10,cy);c.moveTo(cx,cy-10);c.lineTo(cx,cy+10);c.strokeStyle='#c9557f';c.lineWidth=2;c.stroke()}
}
const posOf=e=>{const r=ed.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
ed.onpointerdown=e=>{const m=posOf(e);let bi=-1,bd=48;pts.forEach((p,i)=>{const d=Math.hypot(view.ox+p.x*view.k-m.x,view.oy+p.y*view.k-m.y);if(d<bd){bd=d;bi=i}});drag=bi;if(bi>=0){ed.setPointerCapture(e.pointerId);finger=m;drawEd()}};
ed.onpointermove=e=>{if(drag<0)return;const m=posOf(e);finger=m;pts[drag]={x:Math.max(0,Math.min(src.width,(m.x-view.ox)/view.k)),y:Math.max(0,Math.min(src.height,(m.y-view.oy)/view.k))};drawEd()};
ed.onpointerup=ed.onpointercancel=()=>{drag=-1;finger=null;drawEd()};
new ResizeObserver(()=>{if($('#cropScr').classList.contains('on'))drawEd()}).observe(ed);
$('#rot').onclick=()=>{const t=document.createElement('canvas');t.width=src.height;t.height=src.width;const c=t.getContext('2d');c.translate(t.width,0);c.rotate(Math.PI/2);c.drawImage(src,0,0);src=t;pts=detectOn(src,640)||inset(src);drawEd()};
$('#auto').onclick=()=>{const p=detectOn(src,640);if(p){pts=p;drawEd()}else toast('หาขอบไม่เจอ ลองลากมุมเองนะ')};

/* ---------- ดัดภาพให้ตรง ---------- */
function solve(A,b){const n=b.length;for(let i=0;i<n;i++){let m=i;for(let j=i+1;j<n;j++)if(Math.abs(A[j][i])>Math.abs(A[m][i]))m=j;[A[i],A[m]]=[A[m],A[i]];[b[i],b[m]]=[b[m],b[i]];
 for(let j=i+1;j<n;j++){const f=A[j][i]/A[i][i];for(let k=i;k<n;k++)A[j][k]-=f*A[i][k];b[j]-=f*b[i]}}
 const x=new Array(n);for(let i=n-1;i>=0;i--){let s=b[i];for(let k=i+1;k<n;k++)s-=A[i][k]*x[k];x[i]=s/A[i][i]}return x}
function warp(sc,q,m){
 const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),[p0,p1,p2,p3]=q;
 let W=Math.max(D(p0,p1),D(p3,p2)),H=Math.max(D(p0,p3),D(p1,p2));
 if(m==='card'){if(W>=H)H=W*54/85.6;else W=H*54/85.6}
 const k=Math.min(1.6,2600/Math.max(W,H));W=Math.max(10,Math.round(W*k));H=Math.max(10,Math.round(H*k));
 const dst=[[0,0],[W,0],[W,H],[0,H]],A=[],b=[];
 for(let i=0;i<4;i++){const[x,y]=dst[i],u=q[i].x,v=q[i].y;A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v)}
 const h=solve(A,b),sw=sc.width,sh=sc.height,sd=sc.getContext('2d').getImageData(0,0,sw,sh).data;
 const out=document.createElement('canvas');out.width=W;out.height=H;const oc=out.getContext('2d'),od=oc.createImageData(W,H),o=od.data;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const z=h[6]*x+h[7]*y+1,sx=(h[0]*x+h[1]*y+h[2])/z,sy=(h[3]*x+h[4]*y+h[5])/z;
  const x0=Math.max(0,Math.min(sw-2,sx|0)),y0=Math.max(0,Math.min(sh-2,sy|0)),fx=Math.max(0,Math.min(1,sx-x0)),fy=Math.max(0,Math.min(1,sy-y0)),i=(y0*sw+x0)*4,j=(y*W+x)*4,r=sw*4;
  for(let c=0;c<3;c++){const a=sd[i+c]+(sd[i+4+c]-sd[i+c])*fx,bb=sd[i+r+c]+(sd[i+r+4+c]-sd[i+r+c])*fx;o[j+c]=a+(bb-a)*fy}o[j+3]=255}
 oc.putImageData(od,0,0);return out;
}

/* ---------- ปรับสีแบบเครื่องสแกน ---------- */
function background(c){
 const f=12,w=Math.max(2,Math.round(c.width/f)),h=Math.max(2,Math.round(c.height/f)),s=document.createElement('canvas');s.width=w;s.height=h;
 const x=s.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(c,0,0,w,h);let im=x.getImageData(0,0,w,h);
 for(let it=0;it<2;it++){const a=im.data,n=new Uint8ClampedArray(a);for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){const j=(y*w+xx)*4;for(let ch=0;ch<3;ch++){let mx=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const yy=Math.min(h-1,Math.max(0,y+dy)),x2=Math.min(w-1,Math.max(0,xx+dx));mx=Math.max(mx,a[(yy*w+x2)*4+ch])}n[j+ch]=mx}}im=new ImageData(n,w,h)}
 x.putImageData(im,0,0);const b=document.createElement('canvas');b.width=c.width;b.height=c.height;const bx=b.getContext('2d');bx.imageSmoothingQuality='high';bx.drawImage(s,0,0,c.width,c.height);
 return bx.getImageData(0,0,c.width,c.height).data;
}
function applyMode(c,m){
 const out=document.createElement('canvas');out.width=c.width;out.height=c.height;const ox=out.getContext('2d');ox.drawImage(c,0,0);
 if(m==='photo')return out;
 const im=ox.getImageData(0,0,c.width,c.height),d=im.data,bg=background(c);
 for(let i=0;i<d.length;i+=4){
  const r=Math.min(255,d[i]*255/Math.max(bg[i],40)),g=Math.min(255,d[i+1]*255/Math.max(bg[i+1],40)),b=Math.min(255,d[i+2]*255/Math.max(bg[i+2],40));
  if(m==='doc'||m==='card'){const k=m==='card'?1.08:1.15,s=v=>Math.max(0,Math.min(255,(v-255)*k+251));d[i]=s(r);d[i+1]=s(g);d[i+2]=s(b)}
  else{let L=r*.3+g*.59+b*.11;if(m==='bw')L=Math.max(0,Math.min(255,(L-100)*255/100));else L=Math.max(0,Math.min(255,(L-255)*1.15+251));d[i]=d[i+1]=d[i+2]=L}}
 sharpen(im,m==='bw'?.4:.9);ox.putImageData(im,0,0);return out;
}
function sharpen(im,amt){const w=im.width,h=im.height,d=im.data,s=new Uint8ClampedArray(d);
 for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=(y*w+x)*4;for(let c=0;c<3;c++){const v=s[i+c],bl=(s[i-4+c]+s[i+4+c]+s[i-w*4+c]+s[i+w*4+c]+v*4)/8;d[i+c]=v+amt*(v-bl)*2}}}

/* ---------- บันทึก / แชร์ ---------- */
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast('บันทึกไฟล์แล้ว')}
async function share(files){
 if(navigator.canShare&&navigator.canShare({files})){try{await navigator.share({files,title:baseName()})}catch(e){if(e.name!=='AbortError')toast('แชร์ไม่สำเร็จ')}}
 else{files.forEach((f,i)=>setTimeout(()=>download(f,f.name),i*600));toast('เครื่องนี้แชร์ตรงไม่ได้ เลยบันทึกไฟล์ให้แทน')}
}

function doShareAll(){share(pages.map((p,i)=>new File([p.blob],`${baseName()}_${i+1}.jpg`,{type:'image/jpeg'})))}
async function doPdf(){busy(true);try{const b=await makePdf(pages.map(p=>p.blob));busy(false);const f=new File([b],baseName()+'.pdf',{type:'application/pdf'});
 if(navigator.canShare&&navigator.canShare({files:[f]})&&confirm('ทำ PDF เสร็จแล้ว ต้องการแชร์เลยไหม?\nกด "ยกเลิก" เพื่อบันทึกลงเครื่อง'))share([f]);else download(b,f.name)}catch(e){busy(false);toast('ทำ PDF ไม่สำเร็จ')}}
async function makePdf(blobs){
 const enc=new TextEncoder(),parts=[],offs=[];let off=0;const push=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);off+=u.length};
 const n=blobs.length,N=2+n*3;push('%PDF-1.4\n');push(new Uint8Array([37,226,227,207,211,10]));
 const obj=(id,s)=>{offs[id]=off;push(`${id} 0 obj\n${s}\nendobj\n`)};
 obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,`<< /Type /Pages /Kids [${blobs.map((_,i)=>`${3+i*3} 0 R`).join(' ')}] /Count ${n} >>`);
 for(let i=0;i<n;i++){
  const bytes=new Uint8Array(await blobs[i].arrayBuffer()),bm=await createImageBitmap(blobs[i]),w=bm.width,h=bm.height;bm.close&&bm.close();
  const land=w>h,PW=land?841.89:595.28,PH=land?595.28:841.89,m=14,s=Math.min((PW-m*2)/w,(PH-m*2)/h),dw=w*s,dh=h*s,x=(PW-dw)/2,y=(PH-dh)/2;
  const pid=3+i*3,iid=pid+1,cid=pid+2,cs=`q ${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im0 Do Q`;
  obj(pid,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>`);
  offs[iid]=off;push(`${iid} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`);push(bytes);push('\nendstream\nendobj\n');
  obj(cid,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
 }
 const xr=off;push(`xref\n0 ${N+1}\n0000000000 65535 f \n`+offs.slice(1,N+1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join(''));
 push(`trailer\n<< /Size ${N+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);return new Blob(parts,{type:'application/pdf'});
}

}
